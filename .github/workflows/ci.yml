name: Offline correctness and evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOXIC_RUN_NEURAL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            requirements-notebooks.txt
            pyproject.toml
      - name: Install core and review dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Check independent pipeline invariants
        run: python -m unittest discover -s tests -v
      - name: Execute results review notebook without model training
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import nbformat
          from nbclient import NotebookClient
          root = Path.cwd()
          path = root / 'notebooks/01_results_review.ipynb'
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=120, kernel_name='python3', resources={'metadata': {'path': str(root)}}).execute()
          code_cells = [cell for cell in notebook.cells if cell.cell_type == 'code']
          if not code_cells or any(cell.execution_count is None for cell in code_cells):
              raise RuntimeError('Every results review code cell must execute')
          destination = Path(os.environ['RUNNER_TEMP']) / 'historical-evidence-review' / '01_results_review.executed.ipynb'
          destination.parent.mkdir(parents=True, exist_ok=True)
          nbformat.write(notebook, destination)
          print('Historical evidence review notebook executed successfully; no training was performed.')
          PY
      - name: Verify publication files and historical tables
        run: python scripts/verify_repository.py
      - name: Retain the executed historical evidence review
        uses: actions/upload-artifact@v4
        with:
          name: historical-evidence-review
          path: ${{ runner.temp }}/historical-evidence-review/01_results_review.executed.ipynb
          if-no-files-found: error

  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOXIC_RUN_NEURAL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            requirements-neural.txt
            requirements-notebooks.txt
            pyproject.toml
      - name: Install the CPU neural test environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-neural.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Verify tiny CPU training and resumable Colab invariants
        run: |
          python - <<'PY'
          import os
          import sys
          import unittest
          from toxic_comments.neural import _dependencies

          if os.environ.get('TOXIC_RUN_NEURAL_TESTS') != '1':
              raise RuntimeError('The neural CI job must enable every tiny CPU check')
          _dependencies()  # Missing or broken neural imports must fail this job.
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_neural', 'tests.test_colab_training',
              'tests.test_colab_integrity',
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('The neural CI job must finish with zero skipped checks.', file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
